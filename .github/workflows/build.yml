name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk telemoto-0.1.${{ github.run_number }}.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk telemoto-watch-0.1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: telemoto-apk
          path: telemoto-*.apk
      - name: GitHub Release (telefondan indirilebilir)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Telemoto 0.1.${{ github.run_number }}
          body: |
            Otomatik derleme · ${{ github.sha }}
            Telefon: telemoto-0.1.x.apk → indir → aç → "Bilinmeyen kaynaklara izin ver".
            Saat: telemoto-watch-0.1.x.apk → ADB (kablosuz hata ayıklama) ile Galaxy Watch'a kur.
          files: telemoto-*.apk
          make_latest: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
